<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Haul Viewer</title>

<!-- iPhone "Add to Home Screen" support: makes it open full-screen like a real app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Haul Viewer" />
<meta name="theme-color" content="#10141C" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310141C'/%3E%3Crect x='24' y='24' width='52' height='52' rx='10' fill='%23E8A33D'/%3E%3C/svg%3E" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#10141C; --panel:#181F2A; --panel2:#1F2733;
    --line:#2B3444; --lineSoft:#232B38;
    --text:#EDEFF3; --muted:#8A93A6; --faint:#5C6579;
    --amber:#E8A33D; --amberDim:#8A6427; --teal:#4FB7A6; --danger:#E2604F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  input::placeholder{color:var(--faint);}
  input, select, button{font-family:inherit;}
  button{cursor:pointer;}
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px;}

  /* header */
  .header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px;}
  .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .eyebrow-badge{width:34px;height:34px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;}
  .eyebrow-text{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--faint);}
  h1{font-size:44px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .subtitle{max-width:420px;font-size:14px;color:var(--muted);margin:0;line-height:1.5;}
  .count-box{padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:right;}
  .count-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0 0 2px;}
  .count-value{font-size:24px;font-weight:700;color:var(--amber);margin:0;}

  /* folder tabs */
  .folders{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .tab{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:14px;background:var(--panel);color:var(--muted);border:1px solid var(--line);transition:opacity .15s;}
  .tab.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .tab .badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--panel2);font-family:'JetBrains Mono',monospace;}
  .tab.active .badge{background:rgba(16,20,28,.2);}
  .tab .del{opacity:0;transition:opacity .15s;padding:2px;border-radius:999px;background:none;border:none;color:inherit;display:flex;}
  .tab:hover .del{opacity:.7;}
  .tab .del:hover{opacity:1;}
  .tab-new{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:14px;background:transparent;color:var(--faint);border:1px dashed var(--line);}
  .tab-new-input{display:flex;align-items:center;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px dashed var(--amber);}
  .tab-new-input input{background:transparent;border:none;outline:none;color:var(--text);font-size:14px;width:120px;}

  /* add form */
  .add-panel{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:20px;margin-bottom:36px;}
  .add-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:end;}
  @media(min-width:760px){.add-grid{grid-template-columns:1fr 1.3fr .8fr auto;}}
  .field label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  .field input, .field select{width:100%;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:14px;outline:none;}
  .field.linkfield{position:relative;}
  .field.linkfield input{padding-left:34px;font-family:'JetBrains Mono',monospace;}
  .field.linkfield .licon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;background:var(--amber);color:var(--ink);border:none;font-size:14px;font-weight:500;}
  .btn-primary:hover{opacity:.9;}
  .add-error{color:var(--danger);font-size:14px;margin:10px 0 0;}
  .add-hint{color:var(--faint);font-size:12px;margin:10px 0 0;line-height:1.5;}

  /* grid */
  .grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr;}}

  .empty{border:1px dashed var(--line);border-radius:16px;padding:80px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:14px;text-align:center;}

  /* card */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink);top:96px;}
  .notch.l{left:-7px;} .notch.r{right:-7px;}
  .imgbox{position:relative;width:100%;height:168px;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .imgbox img{width:100%;height:100%;object-fit:cover;}
  .imgbox .placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--faint);}
  .imgbox .placeholder span{font-size:11px;font-family:'JetBrains Mono',monospace;}
  .status-check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(16,20,28,.75);color:var(--amber);font-size:14px;font-family:'JetBrains Mono',monospace;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(232,163,61,.3);border-top-color:var(--amber);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tag{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
  .tag.verified{background:rgba(79,183,166,.15);color:var(--teal);border:1px solid var(--teal);}
  .tag.manual{background:rgba(232,163,61,.15);color:var(--amber);border:1px solid var(--amberDim);}
  .perf{width:100%;height:1px;background-image:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);}
  .body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0 0 4px;font-family:'JetBrains Mono',monospace;}
  .rowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .pname{font-size:15px;font-weight:500;line-height:1.35;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .provider-select{font-size:10px;padding:4px 8px;border-radius:999px;background:var(--panel2);color:var(--faint);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;max-width:120px;}
  .provider-select.set{background:rgba(232,163,61,.12);color:var(--amber);border-color:var(--amberDim);}
  .pricerow{display:flex;align-items:flex-end;justify-content:space-between;}
  .editbtn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--faint);padding:0;}
  .editbtn .val{color:var(--text);}
  .editbtn .val.empty{color:var(--faint);}
  .editinput{background:transparent;border:none;border-bottom:1px solid var(--amber);outline:none;color:var(--text);font-size:14px;width:100%;padding:2px 0;}
  .domainlink{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .hr{height:1px;background:var(--lineSoft);}
  .bottomrow{display:flex;align-items:center;justify-content:space-between;}
  .stars{display:flex;align-items:center;gap:3px;}
  .stars button{background:none;border:none;padding:0;line-height:0;}
  .delbtn{background:none;border:none;color:var(--danger);padding:6px;border-radius:999px;}
  .delbtn:hover{opacity:.8;}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">
        <div class="eyebrow-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10141C" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
        </div>
        <span class="eyebrow-text mono">Bestellprotokoll</span>
      </div>
      <h1 class="display">Haul Viewer</h1>
      <p class="subtitle">Link rein, Rest läuft automatisch: Preis und Bild werden geprüft. Qualität bewertest du selbst — jederzeit änderbar.</p>
    </div>
    <div class="count-box">
      <p class="count-label mono">Einträge</p>
      <p class="count-value display" id="entry-count">00</p>
    </div>
  </div>

  <div class="folders" id="folder-tabs"></div>

  <div class="add-panel">
    <div class="add-grid">
      <div class="field">
        <label class="mono">Produktname</label>
        <input id="in-name" type="text" placeholder="z. B. Mechanische Tastatur" />
      </div>
      <div class="field linkfield">
        <label class="mono">Link</label>
        <span class="licon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <input id="in-link" type="text" placeholder="https://litbuy.com/produkt/..." />
      </div>
      <div class="field">
        <label class="mono">Anbieter</label>
        <select id="in-folder"></select>
      </div>
      <button class="btn-primary" id="btn-add">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Hinzufügen
      </button>
    </div>
    <p class="add-error" id="add-error" style="display:none;"></p>
    <p class="add-hint">Hinweis: manche Shops blockieren automatisches Auslesen — in dem Fall trägst du Preis und Bild einfach direkt in der Karte nach.</p>
  </div>

  <div id="items-container"></div>
</div>

<script>
/* ---------- storage keys ---------- */
const ITEMS_KEY = "wareneingang-items";
const FOLDERS_KEY = "wareneingang-folders";
const DEFAULT_FOLDERS = [
  { id: "litbuy", name: "Litbuy" },
  { id: "amazon", name: "Amazon" },
  { id: "sonstige", name: "Sonstige" },
];

let items = [];
let folders = [];
let activeFolder = "all";
let addingFolder = false;

/* ---------- helpers ---------- */
function isValidUrl(str){
  try{ const u = new URL(str); return u.protocol==="http:"||u.protocol==="https:"; }catch{ return false; }
}
function domainOf(url){
  try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return url; }
}
function formatPrice(p){
  if(p===null||p===undefined||p==="") return null;
  const n = typeof p === "number" ? p : parseFloat(String(p).replace(",", "."));
  if(isNaN(n)) return String(p);
  return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function esc(s){
  const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML;
}

async function fetchProductMeta(url){
  const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), 9000);
  try{
    const res = await fetch(proxied, { signal: controller.signal });
    clearTimeout(t);
    if(!res.ok) throw new Error("fetch failed");
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const meta = (prop) => doc.querySelector(`meta[property="${prop}"]`)?.getAttribute("content")
      || doc.querySelector(`meta[name="${prop}"]`)?.getAttribute("content") || null;
    const image = meta("og:image") || meta("twitter:image");
    let price = meta("product:price:amount") || meta("og:price:amount");
    if(!price){
      const patterns = [/(?:€|EUR)\s?(\d{1,5}[.,]\d{2})/, /(\d{1,5}[.,]\d{2})\s?(?:€|EUR)/, /"price"\s*:\s*"?(\d{1,5}[.,]?\d{0,2})"?/i];
      for(const p of patterns){ const m = html.match(p); if(m){ price = m[1]; break; } }
    }
    return { image, price, ok: true };
  }catch(e){ clearTimeout(t); return { image:null, price:null, ok:false }; }
}

/* ---------- storage (works inside Claude, and standalone on-device) ---------- */
function hasClaudeStorage(){
  return typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
}
async function storageGet(key){
  if(hasClaudeStorage()){
    try{ return await window.storage.get(key, false); }catch{ return null; }
  }
  try{ const v = localStorage.getItem(key); return v ? { value: v } : null; }catch{ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); }catch{}
    return;
  }
  try{ localStorage.setItem(key, value); }catch{}
}
async function loadAll(){
  try{
    const res = await storageGet(ITEMS_KEY);
    if(res && res.value) items = JSON.parse(res.value);
  }catch{}
  try{
    const res = await storageGet(FOLDERS_KEY);
    if(res && res.value){ folders = JSON.parse(res.value); }
    else { folders = DEFAULT_FOLDERS.slice(); await storageSet(FOLDERS_KEY, JSON.stringify(folders)); }
  }catch{ folders = DEFAULT_FOLDERS.slice(); }
  renderAll();
}
async function persistItems(){ await storageSet(ITEMS_KEY, JSON.stringify(items)); }
async function persistFolders(){ await storageSet(FOLDERS_KEY, JSON.stringify(folders)); }

/* ---------- icons ---------- */
const ICO = {
  folder: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>`,
  folderPlus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>`,
  x: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  externalLink: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  pencil: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  imageOff: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/><line x1="3" y1="3" x2="21" y2="21"/></svg>`,
  checkCircle: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  package: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>`,
  star: (filled) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${filled ? 'var(--amber)' : 'none'}" stroke="${filled ? 'var(--amber)' : 'var(--faint)'}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
};

/* ---------- render: folder tabs ---------- */
function renderFolderTabs(){
  const el = document.getElementById("folder-tabs");
  let html = `<button class="tab ${activeFolder==='all'?'active':''}" data-action="select-folder" data-id="all">Alle <span class="badge mono">${items.length}</span></button>`;
  folders.forEach(f=>{
    const count = items.filter(it=>it.folderId===f.id).length;
    const active = activeFolder===f.id;
    html += `<div class="tab ${active?'active':''}" data-action="select-folder" data-id="${f.id}">
      ${ICO.folder} ${esc(f.name)} <span class="badge mono">${count}</span>
      <button class="del" data-action="delete-folder" data-id="${f.id}">${ICO.x}</button>
    </div>`;
  });
  if(addingFolder){
    html += `<div class="tab-new-input"><input id="new-folder-input" placeholder="Name des Anbieters" autofocus /></div>`;
  } else {
    html += `<button class="tab-new" data-action="add-folder-open">${ICO.folderPlus} Neuer Anbieter</button>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('[data-action="select-folder"]').forEach(node=>{
    node.addEventListener("click", ()=>{ activeFolder = node.dataset.id; renderAll(); });
  });
  el.querySelectorAll('[data-action="delete-folder"]').forEach(node=>{
    node.addEventListener("click", (e)=>{ e.stopPropagation(); deleteFolder(node.dataset.id); });
  });
  const openBtn = el.querySelector('[data-action="add-folder-open"]');
  if(openBtn) openBtn.addEventListener("click", ()=>{ addingFolder = true; renderFolderTabs(); const inp=document.getElementById("new-folder-input"); if(inp) inp.focus(); });
  const newInput = document.getElementById("new-folder-input");
  if(newInput){
    newInput.addEventListener("keydown", (e)=>{
      if(e.key==="Enter") confirmAddFolder(newInput.value);
      if(e.key==="Escape"){ addingFolder=false; renderFolderTabs(); }
    });
    newInput.addEventListener("blur", ()=> confirmAddFolder(newInput.value));
  }
}
function confirmAddFolder(name){
  const trimmed = (name||"").trim();
  addingFolder = false;
  if(!trimmed){ renderFolderTabs(); return; }
  let id = trimmed.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || Date.now().toString(36);
  if(folders.some(f=>f.id===id)){ renderFolderTabs(); return; }
  folders.push({ id, name: trimmed });
  persistFolders();
  renderAll();
}
function deleteFolder(id){
  folders = folders.filter(f=>f.id!==id);
  persistFolders();
  if(activeFolder===id) activeFolder="all";
  items = items.map(it=> it.folderId===id ? {...it, folderId:null} : it);
  persistItems();
  renderAll();
}

/* ---------- render: add form folder select ---------- */
function renderFolderSelect(){
  const sel = document.getElementById("in-folder");
  const current = sel.value;
  sel.innerHTML = `<option value="">kein Anbieter</option>` + folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("");
  if([...sel.options].some(o=>o.value===current)) sel.value = current;
}

/* ---------- render: items grid ---------- */
function renderItems(){
  const el = document.getElementById("items-container");
  const visible = activeFolder==="all" ? items : items.filter(it=>it.folderId===activeFolder);
  if(visible.length===0){
    el.innerHTML = `<div class="empty">${ICO.package}<p>${items.length===0 ? "Noch keine Bestellungen erfasst. Trag oben deinen ersten Link ein." : "Für diesen Anbieter ist noch nichts eingetragen."}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${visible.map(cardHtml).join("")}</div>`;
  bindCardEvents();
}

function cardHtml(item){
  const folder = folders.find(f=>f.id===item.folderId) || null;
  const priceVal = item.price;
  const priceDisplay = priceVal ? esc(formatPrice(priceVal)) : "Preis eintragen";
  let tag = "";
  if(item.status==="verified") tag = `<div class="tag verified">${ICO.checkCircle} geprüft</div>`;
  else if(item.status==="manual") tag = `<div class="tag manual">manuell</div>`;

  const imgInner = item.image
    ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'placeholder', innerHTML:'${ICO.imageOff.replace(/'/g,"\\'")}<span class=\\'mono\\'>kein Bild</span>'}))" />`
    : `<div class="placeholder">${ICO.imageOff}<span class="mono">kein Bild</span></div>`;

  const checking = item.status==="checking" ? `<div class="status-check"><div class="spinner"></div><span>prüfe link…</span></div>` : "";

  const stars = [1,2,3,4,5].map(n=>{
    const filled = (item.quality||0) >= n;
    return `<button data-action="rate" data-id="${item.id}" data-n="${n}">${ICO.star(filled)}</button>`;
  }).join("");

  return `
  <div class="card">
    <div class="notch l"></div><div class="notch r"></div>
    <div class="imgbox">${imgInner}${checking}${tag}</div>
    <div class="perf"></div>
    <div class="body">
      <div>
        <div class="rowhead">
          <p class="lbl">Produkt</p>
          <select class="provider-select ${folder?'set':''}" data-action="set-folder" data-id="${item.id}">
            <option value="">kein Anbieter</option>
            ${folders.map(f=>`<option value="${f.id}" ${item.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join("")}
          </select>
        </div>
        <p class="pname">${esc(item.name)}</p>
      </div>
      <div class="pricerow">
        <div>
          <p class="lbl">Preis</p>
          <button class="editbtn" data-action="edit-price" data-id="${item.id}">
            <span class="val ${priceVal?'':'empty'} mono">${priceDisplay}</span>${ICO.pencil}
          </button>
        </div>
        <a class="domainlink" href="${esc(item.link)}" target="_blank" rel="noreferrer">${esc(domainOf(item.link))} ${ICO.externalLink}</a>
      </div>
      <div class="hr"></div>
      <div class="bottomrow">
        <div>
          <p class="lbl">Qualität</p>
          <div class="stars">${stars}</div>
        </div>
        <button class="delbtn" data-action="delete" data-id="${item.id}">${ICO.trash}</button>
      </div>
    </div>
  </div>`;
}

function bindCardEvents(){
  document.querySelectorAll('[data-action="set-folder"]').forEach(sel=>{
    sel.addEventListener("change", ()=> updateItem(sel.dataset.id, { folderId: sel.value || null }));
  });
  document.querySelectorAll('[data-action="rate"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id, n = parseInt(btn.dataset.n,10);
      const it = items.find(i=>i.id===id);
      const newVal = (it.quality||0) === n ? 0 : n;
      updateItem(id, { quality: newVal });
    });
  });
  document.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener("click", ()=> deleteItem(btn.dataset.id));
  });
  document.querySelectorAll('[data-action="edit-price"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id;
      const it = items.find(i=>i.id===id);
      const input = document.createElement("input");
      input.className = "editinput mono";
      input.value = it.price ?? "";
      input.placeholder = "z. B. 29,99";
      btn.replaceWith(input);
      input.focus();
      input.select();
      const commit = ()=>{ updateItem(id, { price: input.value }); };
      input.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ commit(); } if(e.key==="Escape"){ renderItems(); } });
      input.addEventListener("blur", commit);
    });
  });
}

/* ---------- item mutations ---------- */
function updateItem(id, patch){
  items = items.map(it=> it.id===id ? {...it, ...patch} : it);
  persistItems();
  renderAll();
}
function deleteItem(id){
  items = items.filter(it=>it.id!==id);
  persistItems();
  renderAll();
}
async function addItem(){
  const nameInput = document.getElementById("in-name");
  const linkInput = document.getElementById("in-link");
  const folderSelect = document.getElementById("in-folder");
  const errEl = document.getElementById("add-error");
  errEl.style.display = "none";

  const name = nameInput.value.trim();
  const link = linkInput.value.trim();

  if(!name){ errEl.textContent = "Bitte einen Produktnamen eintragen."; errEl.style.display="block"; return; }
  if(!isValidUrl(link)){ errEl.textContent = "Der Link sieht nicht gültig aus (bitte mit https:// beginnen)."; errEl.style.display="block"; return; }

  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const chosenFolder = folderSelect.value || (activeFolder!=="all" ? activeFolder : null);

  const draft = { id, name, link, image:null, price:null, quality:0, folderId: chosenFolder, status:"checking", addedAt: new Date().toISOString() };
  items = [draft, ...items];
  persistItems();
  renderAll();

  nameInput.value = ""; linkInput.value = ""; folderSelect.value = "";

  const meta = await fetchProductMeta(link);
  const patch = meta.ok
    ? { image: meta.image || null, price: meta.price || null, status: (meta.image || meta.price) ? "verified" : "manual" }
    : { status: "manual" };

  items = items.map(it=> it.id===id ? {...it, ...patch} : it);
  persistItems();
  renderAll();
}

/* ---------- main render ---------- */
function renderAll(){
  document.getElementById("entry-count").textContent = String(items.length).padStart(2,"0");
  renderFolderTabs();
  renderFolderSelect();
  renderItems();
}

document.getElementById("btn-add").addEventListener("click", addItem);
document.getElementById("in-link").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addItem(); });

loadAll();
</script>
</body>
</html>
